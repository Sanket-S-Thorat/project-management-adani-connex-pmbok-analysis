<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adani Connex | Strategic Board Command Center</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #0b0f19;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* App handles scrolling */
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(30, 41, 59, 0.6);
        }
        .sidebar-item {
            transition: all 0.2s ease;
        }
        .sidebar-item:hover, .sidebar-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-right: 3px solid #3b82f6;
            color: #fff;
        }
        .map-marker circle {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .map-marker:hover circle {
            r: 8;
            stroke: white;
            stroke-width: 2px;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));
        }
        /* Timeline Custom Scrollbar */
        .timeline-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .timeline-scroll::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }
        .timeline-scroll::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const IconTrendingUp = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
        const IconServer = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"></rect><rect width="20" height="8" x="2" y="14" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>;
        const IconDollarSign = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>;
        const IconActivity = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const IconMapPin = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>;
        const IconPieChart = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>;
        const IconClock = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconShield = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
        const IconGrid = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>;
        const IconFileText = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;

        // --- Data Extraction from PDF ---
        const chronicleData = {
            revenue: "₹408 Cr",
            committedOrderBook: "210 MW",
            financing: {
                totalDebt: "$1.65B",
                milestones: [
                    { date: "Jun '23", amount: "$213M", desc: "Construction Finance (ING, MUFG)" },
                    { date: "Apr '24", amount: "$1.44B", desc: "Sustainability-Linked Loan (Largest in India)" }
                ]
            },
            acquisitions: [
                { name: "Girdhari Build Estate", amount: "₹366 Cr", purpose: "Land Bank" },
                { name: "Trade Castle Tech Park", amount: "₹234 Cr", purpose: "Land Bank" }
            ],
            timeline: [
                { year: "2021", month: "Feb", title: "JV Genesis", desc: "50:50 JV formed between Adani & EdgeConneX. Goal: 1 GW by 2030." },
                { year: "2022", month: "Oct", title: "Chennai Live", desc: "17 MW Phase 1 commissioned. IGBC Platinum design." },
                { year: "2023", month: "Jun", title: "First Close", desc: "$213M Construction Financing secured." },
                { year: "2023", month: "Dec", title: "Resilience Test", desc: "Cyclone Michaung hits Chennai. 100% Uptime maintained." },
                { year: "2024", month: "Apr", title: "Mega Funding", desc: "$1.44B Sustainability-Linked Financing raised." },
                { year: "2025", month: "Jan", title: "Noida Live", desc: "10 MW Phase 1 operational in strategic NCR market." },
                { year: "2025", month: "Oct", title: "AI Pivot", desc: "Google Partnership for 1 GW Vizag AI Hub announced." },
                { year: "2025", month: "Dec", title: "Land Banking", desc: "₹600 Cr deployed for acquisitions (Girdhari & Trade Castle)." },
                { year: "2026", month: "Jan", title: "Profitability", desc: "Revenue hits ₹408 Cr. Transition to profit realization." }
            ]
        };

        const locations = [
            { id: 1, name: "Noida", x: 40, y: 25, status: "green", mw: "10/50 MW", details: "Ph-1 Operational. Safety Gold Award.", radar: [90, 85, 95, 90, 80] },
            { id: 2, name: "Mumbai", x: 25, y: 55, status: "amber", mw: "80 MW", details: "Grid power negotiations in final stage.", radar: [60, 70, 50, 40, 95] },
            { id: 3, name: "Hyderabad", x: 45, y: 60, status: "green", mw: "9.6/40 MW", details: "5-Star British Safety Council Rating.", radar: [95, 90, 95, 90, 85] },
            { id: 4, name: "Visakhapatnam", x: 55, y: 65, status: "blue", mw: "1 GW", details: "Google AI Hub. Liquid cooling ready.", radar: [20, 100, 60, 90, 100] },
            { id: 5, name: "Chennai", x: 45, y: 80, status: "green", mw: "17/33 MW", details: "100% Uptime (Cyclone Tested).", radar: [100, 95, 100, 100, 90] }
        ];

        // --- Chart Component ---
        const ChartComponent = ({ type, data, options, id }) => {
            const chartRef = useRef(null);
            const canvasRef = useRef(null);

            useEffect(() => {
                if (canvasRef.current) {
                    if (chartRef.current) chartRef.current.destroy();
                    const ctx = canvasRef.current.getContext('2d');
                    
                    // Add gradient support if needed
                    let chartData = { ...data };
                    if (type === 'line' || type === 'bar') {
                        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                        gradient.addColorStop(0, type === 'line' ? 'rgba(59, 130, 246, 0.5)' : 'rgba(16, 185, 129, 0.8)');
                        gradient.addColorStop(1, type === 'line' ? 'rgba(59, 130, 246, 0.0)' : 'rgba(16, 185, 129, 0.2)');
                        
                        // Apply to first dataset if not specified
                        if(chartData.datasets[0] && !chartData.datasets[0].backgroundColor) {
                             chartData.datasets[0].backgroundColor = gradient;
                        }
                    }

                    chartRef.current = new Chart(ctx, {
                        type: type,
                        data: chartData,
                        options: {
                            ...options,
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 1200, easing: 'easeOutQuart' },
                            plugins: {
                                legend: { labels: { color: '#94a3b8', font: {family: 'Inter'} } }
                            },
                            scales: options.scales || {
                                x: { grid: { display: false }, ticks: { color: '#64748b' } },
                                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
                            }
                        }
                    });
                }
            }, [data, options, type]);

            return <div className="h-full w-full"><canvas ref={canvasRef} id={id}></canvas></div>;
        };

        // --- Sub-Views ---

        const DashboardOverview = ({ onLocationSelect, selectedLoc }) => {
             // Financial Trajectory Chart
             const finData = {
                labels: ['FY23', 'FY24', 'FY25', 'FY26(P)', 'FY27(P)'],
                datasets: [{
                    label: 'Revenue (₹ Cr)',
                    data: [50, 180, 408, 850, 1600],
                    borderColor: '#3b82f6',
                    fill: true,
                    tension: 0.4
                }]
            };

            return (
                <div className="grid grid-cols-12 gap-6 h-full">
                    {/* Map Section */}
                    <div className="col-span-12 lg:col-span-5 glass-panel rounded-2xl p-4 flex flex-col relative overflow-hidden h-[500px] lg:h-auto">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
                        <div className="flex justify-between items-center mb-2 z-10">
                            <h3 className="font-bold text-white flex items-center gap-2"><IconMapPin size={16} className="text-blue-400"/> Operational Footprint</h3>
                            <span className="text-[10px] bg-blue-900/30 text-blue-300 px-2 py-1 rounded border border-blue-500/30 animate-pulse">Live</span>
                        </div>
                        <div className="flex-grow relative z-0">
                             <IndiaMap onLocationSelect={onLocationSelect} selectedLoc={selectedLoc} />
                        </div>
                    </div>

                    {/* Metrics & Deep Dive */}
                    <div className="col-span-12 lg:col-span-7 flex flex-col gap-6 h-full overflow-y-auto pr-2">
                        {/* KPI Cards */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="glass-panel p-4 rounded-xl border-l-4 border-blue-500">
                                <div className="text-slate-400 text-xs uppercase font-bold">Revenue FY25</div>
                                <div className="text-2xl font-bold text-white mt-1">₹408 Cr</div>
                                <div className="text-xs text-green-400 flex items-center gap-1 mt-1"><IconTrendingUp size={12}/> +126% YoY</div>
                            </div>
                            <div className="glass-panel p-4 rounded-xl border-l-4 border-emerald-500">
                                <div className="text-slate-400 text-xs uppercase font-bold">Committed Cap</div>
                                <div className="text-2xl font-bold text-white mt-1">210 MW</div>
                                <div className="text-xs text-slate-400 mt-1">Order Book</div>
                            </div>
                             <div className="glass-panel p-4 rounded-xl border-l-4 border-amber-500">
                                <div className="text-slate-400 text-xs uppercase font-bold">Debt Raised</div>
                                <div className="text-2xl font-bold text-white mt-1">$1.65 Bn</div>
                                <div className="text-xs text-green-400 mt-1">Fully Funded</div>
                            </div>
                             <div className="glass-panel p-4 rounded-xl border-l-4 border-indigo-500">
                                <div className="text-slate-400 text-xs uppercase font-bold">Safety Rating</div>
                                <div className="text-2xl font-bold text-white mt-1">5-Star</div>
                                <div className="text-xs text-indigo-300 mt-1">British Council</div>
                            </div>
                        </div>

                        {/* Financial Growth Chart */}
                        <div className="glass-panel rounded-xl p-5 h-64">
                             <h3 className="font-bold text-white text-sm mb-2">Revenue Velocity</h3>
                             <ChartComponent type="line" data={finData} options={{plugins:{legend:{display:false}}}} id="revChart" />
                        </div>

                        {/* Location Deep Dive */}
                        <div className="glass-panel rounded-xl p-5 flex-grow min-h-[200px] flex gap-4">
                            <div className="w-1/3">
                                <h3 className="font-bold text-white text-lg">{selectedLoc.name} Hub</h3>
                                <div className={`inline-block px-2 py-0.5 rounded text-[10px] font-bold mt-1 mb-2 ${selectedLoc.status === 'green' ? 'bg-green-500/20 text-green-400' : selectedLoc.status === 'blue' ? 'bg-blue-500/20 text-blue-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                    {selectedLoc.status === 'blue' ? 'DEVELOPMENT' : selectedLoc.status.toUpperCase()}
                                </div>
                                <div className="text-2xl font-bold text-white">{selectedLoc.mw}</div>
                                <div className="text-[10px] text-slate-400 mb-3">Capacity</div>
                                <p className="text-xs text-slate-300 border-l-2 border-slate-600 pl-2 italic">"{selectedLoc.details}"</p>
                            </div>
                            <div className="w-2/3">
                                <ChartComponent 
                                    type="radar" 
                                    data={{
                                        labels: ['Const.', 'Budget', 'Reg.', 'Power', 'Sales'],
                                        datasets: [{
                                            label: 'Health',
                                            data: selectedLoc.radar,
                                            borderColor: '#3b82f6',
                                            backgroundColor: 'rgba(59, 130, 246, 0.2)',
                                            pointBackgroundColor: '#fff'
                                        }]
                                    }}
                                    options={{scales:{r:{ticks:{display:false}, grid:{color:'rgba(255,255,255,0.1)'}, pointLabels:{color:'#94a3b8', font:{size:10}}}}}}
                                    id="radarOverview" 
                                />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const FinancialView = () => {
             const capitalStack = {
                labels: ['Construction Finance', 'Sustain. Loan', 'Equity/Rev', 'Land Acquisitions'],
                datasets: [{
                    label: 'USD Millions (Approx)',
                    data: [213, 1440, 50, -72], // Land acq shown as negative or overlay? Let's keep distinct.
                    backgroundColor: ['#64748b', '#22c55e', '#3b82f6', '#ef4444'],
                    borderRadius: 4
                }]
            };
            
            const acqData = {
                labels: ['Girdhari Build Estate', 'Trade Castle Tech', 'Other/Future'],
                datasets: [{
                    data: [366, 234, 150], // approx buffer
                    backgroundColor: ['#f59e0b', '#8b5cf6', '#334155'],
                    borderWidth: 0
                }]
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full overflow-y-auto">
                    <div className="glass-panel rounded-2xl p-6">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><IconDollarSign className="text-green-400"/> Capital Stack & Deployment</h3>
                        <p className="text-sm text-slate-400 mb-6">
                            AdaniConneX has secured India's largest data center financing ($1.44B) linked to sustainability KPIs. 
                            This "Accordion" structure minimizes cost of carry.
                        </p>
                        <div className="h-64">
                            <ChartComponent type="bar" data={capitalStack} options={{}} id="capStackChart" />
                        </div>
                        <div className="mt-4 grid grid-cols-2 gap-4">
                            <div className="bg-slate-800/50 p-3 rounded-lg border border-slate-700">
                                <div className="text-xs text-slate-400">Total Debt Raised</div>
                                <div className="text-xl font-bold text-white">$1.65 Billion</div>
                            </div>
                            <div className="bg-slate-800/50 p-3 rounded-lg border border-slate-700">
                                <div className="text-xs text-slate-400">Avg Cost Efficiency</div>
                                <div className="text-xl font-bold text-green-400">Optimized</div>
                            </div>
                        </div>
                    </div>

                    <div className="glass-panel rounded-2xl p-6">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><IconPieChart className="text-amber-400"/> Strategic Land Banking</h3>
                         <div className="flex items-center gap-6 h-64">
                            <div className="w-1/2 h-full">
                                <ChartComponent type="doughnut" data={acqData} options={{cutout:'70%', plugins:{legend:{position:'bottom'}}}} id="acqChart" />
                            </div>
                            <div className="w-1/2 space-y-4">
                                <div className="text-sm text-slate-300">
                                    <span className="font-bold text-amber-400">₹366 Cr</span> deployed for Girdhari Build Estate (Noida Expansion).
                                </div>
                                <div className="text-sm text-slate-300">
                                    <span className="font-bold text-purple-400">₹234 Cr</span> deployed for Trade Castle Tech Park.
                                </div>
                                <div className="text-xs text-slate-500 mt-4 pt-4 border-t border-slate-700">
                                    *Land banking strategy insulates against future price inflation and zoning risks.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const OperationsView = () => {
             const funnelData = {
                labels: ['Vision 2030', 'Committed', 'Under Const.', 'Operational'],
                datasets: [{
                    label: 'Capacity (MW)',
                    data: [1000, 210, 150, 36.6], // Approx op capacity
                    backgroundColor: ['#1e293b', '#3b82f6', '#f59e0b', '#22c55e'],
                    borderRadius: 4,
                    barPercentage: 0.6
                }]
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full">
                    <div className="glass-panel rounded-2xl p-6">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><IconServer className="text-blue-400"/> Capacity Realization Funnel</h3>
                        <div className="h-64">
                            <ChartComponent type="bar" data={funnelData} options={{indexAxis: 'y'}} id="funnelChart" />
                        </div>
                         <div className="mt-4 p-4 bg-blue-900/20 border border-blue-500/30 rounded-xl">
                            <h4 className="text-blue-300 font-bold text-sm mb-1">Order Book Strength</h4>
                            <p className="text-xs text-slate-400">
                                210 MW committed capacity ensures long-term revenue visibility. The "Build-to-Suit" model with Hyperscalers (e.g., Google) de-risks the 1 GW expansion.
                            </p>
                        </div>
                    </div>
                     <div className="glass-panel rounded-2xl p-6 flex flex-col justify-center items-center text-center">
                        <div className="w-32 h-32 rounded-full bg-indigo-500/20 flex items-center justify-center border-4 border-indigo-500/50 mb-4 animate-float">
                            <IconShield size={64} className="text-indigo-400"/>
                        </div>
                        <h3 className="text-2xl font-bold text-white">Operational Excellence</h3>
                        <div className="mt-6 grid grid-cols-2 gap-8 w-full">
                            <div>
                                <div className="text-4xl font-bold text-white">100%</div>
                                <div className="text-sm text-slate-400">Uptime (Cyclone Michaung)</div>
                            </div>
                            <div>
                                <div className="text-4xl font-bold text-white">5-Star</div>
                                <div className="text-sm text-slate-400">BSC Safety Rating</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ChronicleView = () => {
            return (
                <div className="glass-panel rounded-2xl p-6 h-full flex flex-col">
                    <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><IconClock className="text-pink-400"/> Project Chronicle: The Journey to Profitability</h3>
                    <div className="flex-grow overflow-x-auto overflow-y-hidden timeline-scroll relative">
                        {/* Timeline Line */}
                        <div className="absolute top-1/2 left-0 w-[2000px] h-1 bg-slate-700 -translate-y-1/2 rounded-full"></div>
                        
                        <div className="flex gap-8 items-center h-full min-w-[1800px] px-8">
                            {chronicleData.timeline.map((event, idx) => (
                                <div key={idx} className="relative group w-64 flex-shrink-0">
                                    {/* Dot */}
                                    <div className="absolute top-1/2 left-1/2 w-4 h-4 bg-slate-900 border-4 border-blue-500 rounded-full -translate-x-1/2 -translate-y-1/2 z-10 transition-all duration-300 group-hover:scale-150 group-hover:border-white"></div>
                                    
                                    {/* Content Card (Alternate Top/Bottom) */}
                                    <div className={`absolute left-0 w-full p-4 glass-panel rounded-xl border border-slate-600/50 transition-all duration-300 group-hover:bg-blue-900/40 group-hover:border-blue-400 ${idx % 2 === 0 ? 'bottom-[60%] mb-4' : 'top-[60%] mt-4'}`}>
                                        <div className="text-xs font-bold text-blue-400 mb-1">{event.year} • {event.month}</div>
                                        <h4 className="text-sm font-bold text-white mb-2">{event.title}</h4>
                                        <p className="text-[10px] text-slate-300 leading-relaxed">{event.desc}</p>
                                    </div>

                                    {/* Connecting Line */}
                                    <div className={`absolute left-1/2 w-0.5 bg-blue-500/50 h-[50px] -translate-x-1/2 ${idx % 2 === 0 ? 'bottom-1/2 mb-2' : 'top-1/2 mt-2'}`}></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Layout Shell ---

        const IndiaMap = ({ onLocationSelect, selectedLoc }) => {
            const indiaPath = "M 35 5 L 55 5 L 65 20 L 75 25 L 60 40 L 55 60 L 45 90 L 35 60 L 20 45 L 20 30 L 35 5 Z"; 
            return (
                <div className="relative w-full h-full flex items-center justify-center p-4">
                    <svg viewBox="0 0 100 100" className="h-full w-full drop-shadow-2xl">
                        <path d={indiaPath} fill="#1e293b" stroke="#334155" strokeWidth="0.5" />
                        {locations.map(loc => (
                            <g key={loc.id} className="map-marker" onClick={() => onLocationSelect(loc)}>
                                <circle 
                                    cx={loc.x} cy={loc.y} r={selectedLoc?.id === loc.id ? 4 : 2} 
                                    fill={loc.status === 'green' ? '#10b981' : loc.status === 'blue' ? '#3b82f6' : '#f59e0b'}
                                    className={selectedLoc?.id === loc.id ? "animate-pulse" : ""}
                                />
                                <text x={loc.x + 4} y={loc.y + 1} fontSize="3" fill="#94a3b8" className="select-none font-bold">
                                    {loc.name.toUpperCase()}
                                </text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        const App = () => {
            const [activeView, setActiveView] = useState('overview');
            const [selectedLocation, setSelectedLocation] = useState(locations[2]);

            const renderContent = () => {
                switch(activeView) {
                    case 'overview': return <DashboardOverview onLocationSelect={setSelectedLocation} selectedLoc={selectedLocation} />;
                    case 'financials': return <FinancialView />;
                    case 'operations': return <OperationsView />;
                    case 'chronicle': return <ChronicleView />;
                    case 'pdf': return (
                        <div className="w-full h-full glass-panel rounded-2xl overflow-hidden flex flex-col">
                             <div className="bg-slate-800/50 p-2 border-b border-slate-700 flex justify-between items-center">
                                <span className="text-xs text-slate-400">AdaniConneX Project Chronicle Report.pdf</span>
                            </div>
                            <iframe src="AdaniConneX Project Chronicle Report.pdf" className="w-full h-full border-none bg-slate-900" title="PDF"></iframe>
                        </div>
                    );
                    default: return <DashboardOverview onLocationSelect={setSelectedLocation} selectedLoc={selectedLocation} />;
                }
            };

            const NavItem = ({ id, label, icon: Icon }) => (
                <button 
                    onClick={() => setActiveView(id)}
                    className={`sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium ${activeView === id ? 'active text-white bg-blue-500/10 border-r-2 border-blue-500' : 'text-slate-400 hover:text-white'}`}
                >
                    <Icon size={18} />
                    <span>{label}</span>
                </button>
            );

            return (
                <div className="flex h-screen bg-[#0b0f19] text-slate-200">
                    {/* Sidebar */}
                    <div className="w-64 flex-shrink-0 border-r border-slate-800 flex flex-col bg-[#0b0f19]">
                        <div className="p-6">
                            <h1 className="text-2xl font-black text-white tracking-tight">ADANI<span className="text-blue-500">CONNEX</span></h1>
                            <div className="text-[10px] text-slate-500 mt-1 uppercase tracking-widest">Board Strategy Room</div>
                        </div>
                        <nav className="flex-grow space-y-1 mt-4">
                            <NavItem id="overview" label="Overview" icon={IconGrid} />
                            <NavItem id="financials" label="Financials & Capital" icon={IconDollarSign} />
                            <NavItem id="operations" label="Operations & Capacity" icon={IconServer} />
                            <NavItem id="chronicle" label="Project Chronicle" icon={IconClock} />
                            <div className="my-4 border-t border-slate-800 mx-4"></div>
                            <NavItem id="pdf" label="Report Archives" icon={IconFileText} />
                        </nav>
                        <div className="p-4">
                            <div className="glass-panel p-3 rounded-xl">
                                <div className="text-[10px] text-slate-400 mb-1">Total Debt Raised</div>
                                <div className="text-xl font-bold text-white">$1.65 Bn</div>
                                <div className="w-full bg-slate-700 h-1 mt-2 rounded-full overflow-hidden">
                                    <div className="bg-green-500 w-full h-full"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-grow flex flex-col h-screen overflow-hidden">
                        <header className="h-16 border-b border-slate-800 flex items-center justify-between px-8 bg-[#0b0f19]">
                            <h2 className="text-lg font-bold text-white capitalize">{activeView === 'pdf' ? 'Digital Archives' : activeView} Dashboard</h2>
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2 text-xs text-slate-400">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                    System Live
                                </div>
                                <div className="text-xs text-slate-500">Last Updated: Jan 12, 2026</div>
                            </div>
                        </header>
                        <main className="flex-grow p-6 overflow-hidden">
                            {renderContent()}
                        </main>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
