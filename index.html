        }
        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(30, 41, 59, 0.6);
        }
        .sidebar-item {
            transition: all 0.2s ease;
        }
        .sidebar-item:hover, .sidebar-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-right: 3px solid #3b82f6;
            color: #fff;
        }
        .map-marker circle {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .map-marker:hover circle {
            r: 8;
            stroke: white;
            stroke-width: 2px;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));

        /* Custom Scrollbar */

        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .matrix-cell {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .matrix-cell:hover {

        .markdown-content h3 { font-size: 1.25rem; font-weight: 600; color: #94a3b8; margin-top: 1.5rem; margin-bottom: 0.75rem; }

        .markdown-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .markdown-content li { margin-bottom: 0.5rem; }
        .markdown-content table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }

        .search-highlight { background-color: rgba(234, 179, 8, 0.4); color: white; padding: 0 2px; border-radius: 2px; }

| Employees | Quarterly | Town halls, pulse surveys | 4 | Geographic dispersion |
| Supply Chain | Monthly | Vendor meetings, performance reviews | 3 | Regional vendor gaps |

**Gaps & Lessons:** The Visakhapatnam case reveals that ad-hoc community engagement post-approval is insufficient for mega-projects with environmental sensitivities. Pre-emptive, transparent stakeholder dialogue could have surfaced water-use concerns earlier.

**Recommendations:**
1. **Establish a Stakeholder Advisory Board** comprising government, NGO, and community representatives (executive steering) meeting quarterly before greenfield projects.
2. **Implement Cumulative Impact Reporting:** Publish annual environmental and social reports (GRI-aligned) for all facilities.
3. **Create Feedback Loop Mechanisms:** Implement a project-level ombudsman for grievance resolution (target: 95% resolution within 30 days).

                            .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
                            .replace(/^\- (.*$)/gim, '<ul><li>$1</li></ul>')
                            .replace(/\|(.*)\|/gim, (match) => {
                                const cells = match.split('|').filter(c => c.trim() !== '');
                                if (match.includes('---')) return ''; // Skip separator lines
