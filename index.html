    <style>
        body {
            background-color: #0b0f19;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* App handles scrolling */
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(30, 41, 59, 0.6);
        }
        .sidebar-item {
            transition: all 0.2s ease;
        }
        .sidebar-item:hover, .sidebar-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-right: 3px solid #3b82f6;
            color: #fff;
        }
        .map-marker circle {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .map-marker:hover circle {
            r: 8;
            stroke: white;
            stroke-width: 2px;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));
        }
        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .matrix-cell {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .matrix-cell:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>

            { id: 1, name: "Noida", x: 40, y: 25, status: "green", mw: "10/50 MW", details: "Ph-1 Operational (10MW).", radar: [90, 85, 95, 90, 80] },
            { id: 2, name: "Mumbai", x: 25, y: 55, status: "amber", mw: "80 MW", details: "Grid power negotiations in final stage.", radar: [60, 70, 50, 40, 95] },

        ];

        // --- Chart Component ---
        const ChartComponent = ({ type, data, options, id }) => {
            const chartRef = useRef(null);
            const canvasRef = useRef(null);

            useEffect(() => {
                if (canvasRef.current) {
                    if (chartRef.current) chartRef.current.destroy();
                    const ctx = canvasRef.current.getContext('2d');
                    
                    let chartData = { ...data };
                    if (type === 'line' || type === 'bar') {
                        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                        gradient.addColorStop(0, type === 'line' ? 'rgba(59, 130, 246, 0.5)' : 'rgba(16, 185, 129, 0.8)');
                        gradient.addColorStop(1, type === 'line' ? 'rgba(59, 130, 246, 0.0)' : 'rgba(16, 185, 129, 0.2)');
                        if(chartData.datasets[0] && !chartData.datasets[0].backgroundColor) {
                             chartData.datasets[0].backgroundColor = gradient;
                        }
                    }

                    chartRef.current = new Chart(ctx, {
                        type: type,
                        data: chartData,
                        options: {
                            ...options,
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: { duration: 1200, easing: 'easeOutQuart' },
                            plugins: {
                                legend: { labels: { color: '#94a3b8', font: {family: 'Inter'} } }
                            },
                            scales: options.scales || {
                                x: { grid: { display: false }, ticks: { color: '#64748b' } },
                                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
                            }
                        }
                    });
                }
            }, [data, options, type]);

            return <div className="h-full w-full"><canvas ref={canvasRef} id={id}></canvas></div>;

                            </div>

                        {/* Financial Growth Chart */}

        // --- NEW ENHANCED PMBOK MATRIX VIEW ---
        const AlignmentMatrixView = () => {
            const [activeCell, setActiveCell] = useState(null);

            // Calculate aggregated domain scores
            const domainScores = pmbokMatrix.columns.map((col, cIdx) => {

            const radarData = {
                labels: pmbokMatrix.rows.map(r => r.name),

             const domainData = {

                    {/* Left: Interactive Heatmap Matrix */}

                                <div className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-green-500/30 border border-green-500/50"></span> Applied</div>
                                <div className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-purple-500/30 border border-purple-500/50"></span> Optimized</div>
                            </div>
                        </div>

                        <div className="flex-grow overflow-auto custom-scroll">
                            <table className="w-full text-left border-separate border-spacing-1">
                                <thead>
                                    <tr>
                                        <th className="p-2 text-[10px] text-slate-500 font-bold">PRINCIPLE</th>

                                </thead>
                                <tbody>
                                    {pmbokMatrix.rows.map((row, i) => (

                                                    <div className={`matrix-cell w-full h-10 rounded flex items-center justify-center text-[10px] font-bold border transition-all 
                                                        ${cell.status === 3 ? 'bg-purple-500/20 text-purple-300 border-purple-500/30 hover:bg-purple-500/40' : 
                                                          cell.status === 2 ? 'bg-green-500/20 text-green-300 border-green-500/30 hover:bg-green-500/40' : 
                                                          cell.status === 1 ? 'bg-blue-500/20 text-blue-300 border-blue-500/30 hover:bg-blue-500/40' : 
                                                          'bg-slate-700/50 text-slate-500 border-slate-700'}`}>
                                                        {cell.status === 3 ? 'OPT' : cell.status === 2 ? 'APP' : 'EMG'}
                                                    </div>
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Right: Analytics & Details Panel */}
                    <div className="col-span-4 flex flex-col gap-6 h-full overflow-hidden">
                        
                        {/* Principle Radar Chart */}
                        <div className="glass-panel rounded-2xl p-4 h-1/3 flex flex-col">
                            <h4 className="text-sm font-bold text-white mb-2">Principle Maturity Profile</h4>
                            <div className="flex-grow">
                                <ChartComponent 
                                    type="radar" 
                                    data={radarData} 
                                    options={{
                                        scales: { r: { 
                                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                                            grid: { color: 'rgba(255,255,255,0.1)' },
                                            pointLabels: { color: '#94a3b8', font: { size: 9 } },
                                            ticks: { display: false, max: 100 }
                                        }}
                                    }} 
                                    id="matrixRadar" 
                                />
                            </div>
                        </div>

                         {/* Domain Strength Bar Chart */}
                        <div className="glass-panel rounded-2xl p-4 h-1/4 flex flex-col">
                            <h4 className="text-sm font-bold text-white mb-2">Domain Execution</h4>
                             <div className="flex-grow">
                                <ChartComponent 
                                    type="bar" 
                                    data={domainData} 
                                    options={{
                                        indexAxis: 'y',
                                        plugins: { legend: { display: false } },
                                        scales: { x: { display: false }, y: { ticks: { color: '#94a3b8', font: { size: 9 } } } }
                                    }} 
                                    id="domainBar" 
                                />
                            </div>
                        </div>

                        {/* Detail Inspector Panel */}
                        <div className="glass-panel rounded-2xl p-4 flex-grow bg-slate-800/50 border border-blue-500/20 relative overflow-hidden">
                            {activeCell ? (
                                <div className="animate-fade-in h-full flex flex-col justify-center">
                                    <div className="text-[10px] uppercase text-blue-400 font-bold mb-1 tracking-wider">
                                        {activeCell.principle} × {activeCell.domain}
                                    </div>
                                    <h3 className="text-lg font-bold text-white mb-2 leading-tight">"{activeCell.evidence}"</h3>
                                    <div className="w-full bg-slate-700 h-1 rounded-full overflow-hidden mt-2">
                                        <div className={`h-full ${activeCell.status === 3 ? 'bg-purple-500 w-full' : activeCell.status === 2 ? 'bg-green-500 w-2/3' : 'bg-blue-500 w-1/3'}`}></div>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-2">
                                        Maturity Level: <span className="text-white font-bold">{activeCell.status === 3 ? 'Optimized' : activeCell.status === 2 ? 'Applied' : 'Emerging'}</span>
                                    </p>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-center text-slate-500">
                                    <IconCheckCircle size={32} className="mb-2 opacity-50"/>
                                    <p className="text-xs">Select any cell in the matrix<br/>to reveal evidence.</p>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        };

        const FinancialView = () => {
             const capitalStack = {
                labels: ['Construction Finance', 'Sustain. Loan', 'Equity/Rev', 'Land Acquisitions'],
                datasets: [{
                    label: 'USD Millions (Approx)',
                    data: [213, 1440, 50, -72], 
                    backgroundColor: ['#64748b', '#22c55e', '#3b82f6', '#ef4444'],
                    borderRadius: 4
                }]
            };
            
            const acqData = {
                labels: ['Girdhari Build Estate', 'Trade Castle Tech', 'Other'],
                datasets: [{
                    data: [366, 234, 150], 
                    backgroundColor: ['#f59e0b', '#8b5cf6', '#334155'],
                    borderWidth: 0
                }]
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full overflow-y-auto custom-scroll">
                    <div className="glass-panel rounded-2xl p-6">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><IconDollarSign className="text-green-400"/> Capital Stack & Deployment</h3>
                        <p className="text-sm text-slate-400 mb-6">
                            AdaniConneX has secured India's largest data center financing ($1.44B) linked to sustainability KPIs. 
                        </p>
                        <div className="h-64">
                            <ChartComponent type="bar" data={capitalStack} options={{}} id="capStackChart" />
                        </div>
                    </div>

                    <div className="glass-panel rounded-2xl p-6">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><IconPieChart className="text-amber-400"/> Strategic Land Banking</h3>
                         <div className="flex items-center gap-6 h-64">
                            <div className="w-1/2 h-full">
                                <ChartComponent type="doughnut" data={acqData} options={{cutout:'70%', plugins:{legend:{position:'bottom'}}}} id="acqChart" />
                            </div>
                            <div className="w-1/2 space-y-4">
                                <div className="text-sm text-slate-300">
                                    <span className="font-bold text-amber-400">₹366 Cr</span> deployed for Girdhari Build Estate.
                                </div>
                                <div className="text-sm text-slate-300">
                                    <span className="font-bold text-purple-400">₹234 Cr</span> deployed for Trade Castle Tech Park.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const OperationsView = () => {
             const funnelData = {
                labels: ['Vision 2030', 'Committed', 'Operational'],
                datasets: [{
                    label: 'Capacity (MW)',
                    data: [1000, 210, 36.6], 
                    backgroundColor: ['#1e293b', '#3b82f6', '#22c55e'],
                    borderRadius: 4,
                    barPercentage: 0.6
                }]
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full">
                    <div className="glass-panel rounded-2xl p-6">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><IconServer className="text-blue-400"/> Capacity Realization</h3>
                        <div className="h-64">
                            <ChartComponent type="bar" data={funnelData} options={{indexAxis: 'y'}} id="funnelChart" />
                        </div>
                    </div>
                     <div className="glass-panel rounded-2xl p-6 flex flex-col justify-center items-center text-center">
                        <div className="w-32 h-32 rounded-full bg-indigo-500/20 flex items-center justify-center border-4 border-indigo-500/50 mb-4 animate-float">
                            <IconShield size={64} className="text-indigo-400"/>
                        </div>
                        <h3 className="text-2xl font-bold text-white">Operational Excellence</h3>
                        <div className="mt-6 grid grid-cols-3 gap-4 w-full px-8">
                            <div>
                                <div className="text-2xl font-bold text-white">36.6</div>
                                <div className="text-[10px] text-slate-400">MW Live</div>
                            </div>
                            <div>
                                <div className="text-2xl font-bold text-white">100%</div>
                                <div className="text-[10px] text-slate-400">Uptime</div>
                            </div>
                            <div>
                                <div className="text-2xl font-bold text-white">&lt;1.45</div>
                                <div className="text-[10px] text-slate-400">PUE</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ChronicleView = () => {
            return (
                <div className="glass-panel rounded-2xl p-6 h-full flex flex-col">
                    <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><IconClock className="text-pink-400"/> Project Chronicle: The Journey to Profitability</h3>
                    <div className="flex-grow overflow-x-auto overflow-y-hidden custom-scroll relative">
                        <div className="absolute top-1/2 left-0 w-[2000px] h-1 bg-slate-700 -translate-y-1/2 rounded-full"></div>
                        <div className="flex gap-8 items-center h-full min-w-[1800px] px-8">
                            {chronicleData.timeline.map((event, idx) => (
                                <div key={idx} className="relative group w-64 flex-shrink-0">
                                    <div className="absolute top-1/2 left-1/2 w-4 h-4 bg-slate-900 border-4 border-blue-500 rounded-full -translate-x-1/2 -translate-y-1/2 z-10 transition-all duration-300 group-hover:scale-150 group-hover:border-white"></div>
                                    <div className={`absolute left-0 w-full p-4 glass-panel rounded-xl border border-slate-600/50 transition-all duration-300 group-hover:bg-blue-900/40 group-hover:border-blue-400 ${idx % 2 === 0 ? 'bottom-[60%] mb-4' : 'top-[60%] mt-4'}`}>
                                        <div className="text-xs font-bold text-blue-400 mb-1">{event.year} • {event.month}</div>
                                        <h4 className="text-sm font-bold text-white mb-2">{event.title}</h4>
                                        <p className="text-[10px] text-slate-300 leading-relaxed">{event.desc}</p>
                                    </div>
                                    <div className={`absolute left-1/2 w-0.5 bg-blue-500/50 h-[50px] -translate-x-1/2 ${idx % 2 === 0 ? 'bottom-1/2 mb-2' : 'top-1/2 mt-2'}`}></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Layout Shell ---

        const IndiaMap = ({ onLocationSelect, selectedLoc }) => {
            const indiaPath = "M 35 5 L 55 5 L 65 20 L 75 25 L 60 40 L 55 60 L 45 90 L 35 60 L 20 45 L 20 30 L 35 5 Z"; 
            return (
                <div className="relative w-full h-full flex items-center justify-center p-4">
                    <svg viewBox="0 0 100 100" className="h-full w-full drop-shadow-2xl">
                        <path d={indiaPath} fill="#1e293b" stroke="#334155" strokeWidth="0.5" />
                        {locations.map(loc => (
                            <g key={loc.id} className="map-marker" onClick={() => onLocationSelect(loc)}>
                                <circle 
                                    cx={loc.x} cy={loc.y} r={selectedLoc?.id === loc.id ? 4 : 2} 
                                    fill={loc.status === 'green' ? '#10b981' : loc.status === 'blue' ? '#3b82f6' : '#f59e0b'}
                                    className={selectedLoc?.id === loc.id ? "animate-pulse" : ""}
                                />
                                <text x={loc.x + 4} y={loc.y + 1} fontSize="3" fill="#94a3b8" className="select-none font-bold">
                                    {loc.name.toUpperCase()}
                                </text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        const App = () => {
            const [activeView, setActiveView] = useState('overview');
            const [selectedLocation, setSelectedLocation] = useState(locations[2]);
            const [selectedDoc, setSelectedDoc] = useState('THE BIBLE_ How AdaniConneX came into existence, ri.pdf');

            const renderContent = () => {
                switch(activeView) {
                    case 'overview': return <DashboardOverview onLocationSelect={setSelectedLocation} selectedLoc={selectedLocation} />;
                    case 'financials': return <FinancialView />;
                    case 'operations': return <OperationsView />;
                    case 'chronicle': return <ChronicleView />;
                    case 'matrix': return <AlignmentMatrixView />;
                    case 'pdf': return (
                        <div className="w-full h-full glass-panel rounded-2xl overflow-hidden flex flex-col">
                             <div className="bg-slate-800/50 p-3 border-b border-slate-700 flex justify-between items-center">
                                <span className="text-xs font-bold text-white flex items-center gap-2">
                                    <IconFileText size={16}/> Document Viewer
                                </span>
                                <select 
                                    className="bg-slate-700 text-xs text-white p-1 rounded border border-slate-600 outline-none"
                                    value={selectedDoc}
                                    onChange={(e) => setSelectedDoc(e.target.value)}
                                >
                                    <option value="THE BIBLE_ How AdaniConneX came into existence, ri.pdf">THE BIBLE: AdaniConneX Existence</option>
                                    <option value="AdaniConneX Project Chronicle Report.pdf">Project Chronicle Report</option>
                                </select>
                            </div>
                            <iframe src={selectedDoc} className="w-full h-full border-none bg-slate-900" title="PDF"></iframe>
                        </div>
                    );
                    default: return <DashboardOverview onLocationSelect={setSelectedLocation} selectedLoc={selectedLocation} />;
                }
            };

            const NavItem = ({ id, label, icon: Icon }) => (
                <button 
                    onClick={() => setActiveView(id)}
                    className={`sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium ${activeView === id ? 'active text-white bg-blue-500/10 border-r-2 border-blue-500' : 'text-slate-400 hover:text-white'}`}
                >
                    <Icon size={18} />
                    <span>{label}</span>
                </button>
            );

            return (
                <div className="flex h-screen bg-[#0b0f19] text-slate-200">
                    {/* Sidebar */}
                    <div className="w-64 flex-shrink-0 border-r border-slate-800 flex flex-col bg-[#0b0f19]">
                        <div className="p-6">
                            <h1 className="text-2xl font-black text-white tracking-tight">ADANI<span className="text-blue-500">CONNEX</span></h1>
                            <div className="text-[10px] text-slate-500 mt-1 uppercase tracking-widest">Board Strategy Room</div>
                        </div>
                        <nav className="flex-grow space-y-1 mt-4">
                            <NavItem id="overview" label="Overview" icon={IconGrid} />
                            <NavItem id="financials" label="Financials" icon={IconDollarSign} />
                            <NavItem id="operations" label="Operations" icon={IconServer} />
                            <NavItem id="matrix" label="PMBOK Matrix" icon={IconCheckCircle} />
                            <NavItem id="chronicle" label="Chronicle" icon={IconClock} />
                            <div className="my-4 border-t border-slate-800 mx-4"></div>
                            <NavItem id="pdf" label="Digital Archives" icon={IconFileText} />
                        </nav>
                        <div className="p-4">
                            <div className="glass-panel p-3 rounded-xl">
                                <div className="text-[10px] text-slate-400 mb-1">Total Debt Raised</div>
                                <div className="text-xl font-bold text-white">$1.65 Bn</div>
                                <div className="w-full bg-slate-700 h-1 mt-2 rounded-full overflow-hidden">
                                    <div className="bg-green-500 w-full h-full"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-grow flex flex-col h-screen overflow-hidden">
                        <header className="h-16 border-b border-slate-800 flex items-center justify-between px-8 bg-[#0b0f19]">
                            <h2 className="text-lg font-bold text-white capitalize">{activeView === 'pdf' ? 'Archives' : activeView} Dashboard</h2>
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2 text-xs text-slate-400">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                    System Live
                                </div>
                                <div className="text-xs text-slate-500">Last Updated: Jan 12, 2026</div>
                            </div>
                        </header>
                        <main className="flex-grow p-6 overflow-hidden">
                            {renderContent()}
                        </main>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
